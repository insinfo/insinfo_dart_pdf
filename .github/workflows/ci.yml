name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]


jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.6.2

      # A few signature tests drive the openssl CLI and skip themselves when it
      # is missing; print what the runner has so a skip is visible in the log.
      - name: OpenSSL CLI
        shell: bash
        run: openssl version || echo "openssl not on PATH; openssl-based tests will skip"

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze .

      - name: Run tests
        run: dart test
